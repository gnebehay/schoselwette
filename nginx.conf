# Cache storage for avatars
proxy_cache_path /var/cache/nginx/avatars
    levels=1:2
    keys_zone=avatars_cache:10m
    max_size=1g
    inactive=7d
    use_temp_path=off;

resolver 127.0.0.11 ipv6=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Avatar proxy with caching ---
    location ^~ /adorables/400/ {

        # Extract everything after /adorables/400/
        set $seed $uri;
        rewrite ^/adorables/400/(.*)$ $1 break;

        # Proxy to Dicebear
        proxy_pass https://api.dicebear.com/9.x/bottts-neutral/svg?seed=$seed;

        proxy_ssl_server_name on;

        # Caching
        proxy_cache avatars_cache;

        # IMPORTANT: use normalized URI, not raw request_uri
        proxy_cache_key "$scheme$host$uri";

        proxy_cache_valid 200 301 302 1d;

        proxy_cache_lock on;

        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_buffering on;

        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}