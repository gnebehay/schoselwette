http {

    # Cache storage for avatars
    proxy_cache_path /var/cache/nginx/avatars
        levels=1:2
        keys_zone=avatars_cache:10m
        max_size=1g
        inactive=7d
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # --- Avatar proxy with caching ---
        location ~ ^/adorables/400/(?<seed>.*)$ {

            proxy_pass https://api.dicebear.com/9.x/bottts-neutral/svg?seed=$seed;

            # Important for HTTPS upstream
            proxy_ssl_server_name on;

            # Enable caching
            proxy_cache avatars_cache;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Cache successful responses
            proxy_cache_valid 200 301 302 1d;

            # Avoid hammering upstream when cache expires (dogpile protection)
            proxy_cache_lock on;

            # Optional: allow serving stale content if upstream fails
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # SVG responses are small; disable buffering delays
            proxy_buffering on;

            # Optional: tell clients they can cache too
            add_header X-Cache-Status $upstream_cache_status;
        }

        # --- SPA fallback ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}